[package]
name = "gvm"
version.workspace = true
edition = "2021"
license.workspace = true


[lib]
# No doctests here; skip the rustdoc doctest pass (seconds of harness
# compilation for zero tests). Remove if real doctests are added.
doctest = false
[dependencies]
# The grammar value types both VM crates return (SQ-1103) — an internal,
# zero-dependency workspace crate, so this stays a zero-EXTERNAL-dependency
# crate exactly as before.
grammar-model = { path = "../grammar-model" }

[dev-dependencies]
blorb = { path = "../blorb" }
