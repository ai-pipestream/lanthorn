# ── A pane the game's screen cannot fill: the 7x15 machine ───────────────────
#
# The three sizes above grow both axes together, which is the case where nothing
# interesting happens: the magnification is `min(w, h)`, and a bigger terminal is
# the same composition at a bigger `s`. Grow only the HEIGHT and the story pane
# has rows the game's own screen has no pixels for, and what a mode does with
# those rows is a claim about the mode. `v6_render = "extended"` (SQ-1032) grows
# the canvas DOWNWARD and spends them on whole text rows of the game's own prose
# in the game's own face — the game is told nothing, so its own screen sits at the
# top of the canvas exactly as it laid itself out.
#
# THIS SHOT AND `shogun-amiga-extended` BELOW ARE THE SAME MODE ON DIFFERENT
# ARITHMETIC, which is the only reason the file carries two of it. The extension
# is measured in whole CHARACTER CELLS, and the Version 6 cell is the MACHINE's:
# **7x15 on a Macintosh, 8x16 on every other machine in this manifest** (SQ-0917).
# So the Amiga frame below adds sixteen 16-pixel rows and this one adds
# thirty-eight 15-pixel ones, and the surplus divides differently on each. The
# Macintosh also draws its text at one native pixel per face pixel, so nothing in
# the type here is scaled at all — a 7x15 cell is 7x15 native pixels, times the
# frame's whole magnification.
#
# WHY 62 COLUMNS AND NOT 92. `RasterFrame::extended` pins a whole number of DEVICE
# pixels per NATIVE pixel, and on a pixel-shipping backend that number is capped at
# `MAX_V6_UPSCALE = 2` — the PNG-encode budget, not a layout choice. So the widest
# this frame can ever be is `480 x 2 = 960` device pixels, which is 60 cells of the
# 16x32 grid plus one of border on each side. At the 92 columns this shot carried
# while it was a HYBRID shot (where the letterbox does reach 3x) the composite
# still came out 60 cells wide and the other thirty were empty pane. `(62-2)*16 /
# 480` is exactly 2, the same arithmetic that puts Shogun's row at 82.

[[shots]]
id = "zork0-mac-tall"
title = "Zork Zero"
press = "Macintosh release floppy (.image, HFS), monochrome plates, in a tall terminal"
media = "stories/Zork Zero Disk.image"
args = ["--pictures", "Pic.data"]
caption = """
A terminal taller than the shape Zork Zero was drawn for, with the surplus spent \
on the game's own screen instead of on a letterbox. The Macintosh is the odd \
machine here: it declares a 7x15 character cell where every other press in this \
gallery is 8x16, and it draws its text at one native pixel per face pixel. So the \
thirty-eight rows of prose below Dimwit's banquet hall are 15 native pixels each, \
set in the face off the Macintosh's own disk, and the border, the pillars and the \
compass rose above them are the same picture the game painted — one image, at a \
whole 2x, with nothing in it resampled."""
# `esc` rather than `cr` for the opening notice, and this is the shot that made
# the difference visible: a blank line typed at the parser answers `[I beg your
# pardon?]`, which the small hybrid panes elsewhere scroll away and an extended
# pane keeps on screen for the whole of the transcript.
keys = "wait:3000,esc,wait:1200,text:look,cr,wait:1800,text:ne,cr,wait:2000,text:look,cr,wait:2000"
size = "62x58"
backend = "kitty"
v6_render = "extended"
# In RASTER the whole screen is one image, so there are no text cells for a guard
# to search and the pane title is all `expect` can hold — the same reason
# `shogun-amiga-extended` and `arthur-amiga-proportional` lean on it. The GAME's
# name and not the medium's: 62 columns clip the header at `Zork Zero Disk.ima`,
# and a guard whose truth depends on where a title bar happens to elide is not one.
# Which medium was mounted is measured anyway, into the provenance under the frame.
expect = ["Zork Zero: The Revenge of Megaboz"]
# THE GUARD IS THE EXTENSION ITSELF, not the artwork. Measured: 3300 cells, which
# is 60x55 — the whole of the pane's content. A frame that DECLINED to extend
# letterboxes 480x300 at the same 2x into 960x600, covering 60x19 = 1140 cells, so
# any floor at or below that would pass on a frame that never grew. 2400 is between
# the two with room on both sides.
expect_art_cells = 2400

# ── The fallback everyone can see ────────────────────────────────────────────

[[shots]]
id = "journey-halfblocks"
title = "Journey"
press = "story file, drawn without a graphics protocol"
media = "stories/journey-r83-s890706.z6"
caption = """
The same frame on a terminal with no image protocol at all. lanthorn still runs the \
pixel path and resolves it into half-block cells — two vertical samples per cell, \
so honest but coarse. It is also the only Version 6 output an asciinema cast can \
carry, which is why it earns a row."""
keys = "wait:2500,n,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:2000"
size = "194x63"
backend = "halfblocks"
expect = ["The Party", "Individual Commands", "▀"]
# Half-blocks draws its art as `▀`/`▄`, which is not alphanumeric, so the count is
# the game's letters here exactly as it is on the kitty rows: 517 measured.
expect_prose_cells = 400

# ── The automapper ───────────────────────────────────────────────────────────

[[shots]]
id = "zork1-map"
title = "Zork I"
press = "story file, with the map pane open"
media = "stories/zork1-r88-s840726.z3"
caption = """
The map pane, drawn from nothing but the game's own output as the player walks. \
This is the one frame in the gallery that is about lanthorn rather than about a \
game."""
keys = "wait:2000,text:n,cr,wait:700,text:n,cr,wait:700,text:up,cr,wait:700,text:take egg,cr,wait:700,text:down,cr,wait:900"
size = "122x44"
show_map = true
expect = ["Forest Path", "Up a Tree", "West of House"]

# ── The release's own typeface ───────────────────────────────────────────────
#
# `v6_render` is the only shot field that changes a render MODE: hybrid draws text as
# terminal cells, so a frame meant to show a FACE would show the reader's own font
# instead.
#
# **The rule for every raster shot: a WHOLE-NUMBER magnification, landing as near
# 1280x800 as that press allows.** Free scaling puts an art pixel on a fractional
# number of device pixels, and a resampled glyph edge meeting a font glyph on a
# shared boundary is the exact seam these frames exist to show off.
#
# THE LOCK IS ON FOR EVERY SHOT AND `size` STILL HAS TO BE RIGHT. The pixel lock
# (SQ-1079) is set by the harness, in the run's config, for the whole gallery —
# no shot passes `--v6-pixel-lock`, and `validate` refuses one that tries. It is
# not sufficient on its own, which is the part worth saying: the lock snaps to the
# coarsest RUNG at or below what the pane affords, and a rung is not always an
# integer — the ladder step is `1 / gcd(g_art, g_cell)`, which is a HALF on the
# usual 8x16 cell, so a generous pane locks to 2.5 as happily as to 2.0. The lock
# guarantees a rung; the `size` chooses WHICH one. So `size` is still picked to put
# the free scale inside `[k, k + step)` for the whole `k` whose `native * k` sits
# closest to 1280x800 — 2x for a 640x400 press, and whatever that arithmetic gives
# for a press of another size. The pane is therefore approximate on purpose and the
# result is not.
#
# `magnification` in `gallery.json` is the check, and it is a check rather than a
# comment: it records what was actually captured, so a size that drifts off its
# rung shows up as a fraction there instead of as a slightly soft picture nobody
# looks at twice.

[[shots]]
id = "arthur-amiga-proportional"
title = "Arthur: The Quest for Excalibur"
press = "Amiga release floppy (.adf)"
media = "stories/Arthur - The Quest for Excalibur.adf"
caption = """
The Amiga floppy carries its own typeface, and this frame is drawn with it — a \
proportional face out of the disk's own `char.data`, on the ten-pixel line the \
machine used rather than the sixteen every other press declares. The pen moves by \
each glyph's own advance, so the status bar reads `Churchyard` at the spacing an \
Amiga gave it, and the prose wraps where the pixels run out instead of where a \
column count says."""
keys = "wait:4000,text:n,wait:2500,text:n,wait:3000,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:1500,cr,wait:2000,text:look,cr,wait:7000"
size = "82x28"
backend = "kitty"
v6_render = "raster"
# In RASTER the whole screen is one image, so there are no cells for a text guard
# to search — the same reason `scopa` and `fmvpoker` lean on `expect_art_cells`.
# What the cells still carry is the pane title, which is what catches a medium
# that opened a browser or a neighbouring story instead of this one; the art-cell
# floor proves the composite itself landed.
expect = ["Arthur - The Quest for Excalibur.adf"]
expect_art_cells = 900

# ── The face nobody had to supply ────────────────────────────────────────────
#
# The shot above needs a release floppy. This one needs the opposite: a bare
# story file and a machine named by hand, so that NOTHING answers the face
# cascade and the embedded fallback is what draws. `v6_render` for the same reason
# as above — in hybrid the glyphs on screen would be the reader's own font, and
# the face is the entire subject here.

[[shots]]
id = "macintosh-embedded-face"
title = "Adventure"
press = "bare story file, told it is a Macintosh"
media = "stories/advent.z6"
caption = """
A Macintosh cell with no Macintosh disk behind it. The 7x15 cell is the machine's \
own, but the face Infocom drew it with lives on media nobody is obliged to have — \
so lanthorn falls back to X11 misc-fixed 7x14, which is public domain and, unlike \
the built-in VGA face, is genuinely SEVEN pixels wide. That last part is the whole \
point: the VGA face is drawn for an eight-pixel advance and inks 76 of its 94 \
printable glyphs out to column 6, so a 7-wide cell drops the one column that was \
holding the letters apart."""
# The bare `cr` answers "Would you like instructions?"; the two after it clear the
# [more] pager the credits raise, because a pager eats whatever key comes next and
# a still of a pager is not a still of a typeface.
keys = "wait:2500,cr,wait:1200,cr,wait:800,cr,wait:800,text:look,cr,wait:2500"
# 82 columns is what pins the magnification: `(82-2)/40` is exactly 2, and the
# rows only have to keep up (>= 28). The extra rows past that buy pane height for
# free — 34 still reads `min(2.0, 2.48)` — which is what gets the intro out of the
# pager without moving off the rung.
size = "82x34"
backend = "kitty"
v6_render = "raster"
args = ["--interpreter", "3"]
# Raster puts the whole screen in one image, so the pane title is the only text
# left for a guard to find; `expect_art_cells` is what proves the composite
# landed, exactly as `arthur-amiga-proportional` above does it.
expect = ["advent"]
expect_art_cells = 400

# ── The frame that grows instead of letterboxing ─────────────────────────────
#
# The second of the two `extended` frames, and the pair is deliberate: the mode
# spends a pane's surplus height in whole CHARACTER CELLS, and the Version 6 cell
# is the machine's. `zork0-mac-tall` above is a Macintosh — 7x15, thirty-eight
# rows, text at one native pixel per face pixel. This is an Amiga — 8x16, sixteen
# rows, and a release face the machine draws in the PICTURE space so that a doubled
# press doubles it too (SQ-1053). Same mode, two arithmetics; say which one a
# frame is showing or the second frame is a duplicate of the first.
#
# WHY SHOGUN. The gallery had no Shogun at any press and four Zork Zeros, and this
# is the mode where the choice of game is about its TYPE rather than its artwork —
# the extension is prose, so the frame is worth having on a game with a lot of it.
# The Amiga floppy carries the face as well as the plates: release 295 / 890321,
# and `machine-screenshots/amiga-shogun-game.png` is a capture of that same press
# on a real machine to read this against.
#
# THE PIXEL LOCK IS ON HERE LIKE EVERYWHERE ELSE, and this is the one row where it
# has nothing left to do: `RasterFrame::extended` already floors to a WHOLE number
# of device pixels per NATIVE pixel, which is strictly finer than the lock's
# whole-device-per-ART rung (a HALF on the usual 8x16 cell). The extension's whole
# subject is text, and raster text is drawn on the machine's cell in native pixels,
# so the mode cannot afford a half rung and does not take one. The lock is
# consistency across the gallery rather than a per-shot judgement — which is
# exactly why it is set once in the harness and not argued about per frame.
#
# THE SIZE STILL PINS THE RUNG, and 82 columns is doing it: `(82-2)*16 / 640` is
# exactly 2, and the pane's height only has to be at least that, so the width
# chooses `s = 2` and every row past the 28th is surplus the mode spends. At 44
# rows the pane is 1312 device pixels tall, which is 656 native rows at 2x — the
# game's own 400 plus sixteen whole 16-pixel text rows beneath it.

[[shots]]
id = "shogun-amiga-extended"
title = "James Clavell's Shogun"
press = "Amiga release floppy (.adf), in a tall terminal"
media = "stories/James Clavell's Shogun.adf"
caption = """
Shogun is a novel with a parser in it, and this is the mode that gives it the \
room: a terminal taller than the shape the game was drawn for, with the surplus \
spent on the game's own screen instead of on a letterbox. The status band, the \
Erasmus in her squall and the column of text beside her are laid out exactly \
where the game put them — it is told nothing about any of this — and the sixteen \
rows below its own screen are more of the same prose, set in the typeface off the \
Amiga's own disk at a whole 2x. Nothing in the frame is resampled, and none of \
the type in it is the reader's terminal font."""
# The title splash takes any key, the boot menu takes Enter to select START, and
# the intro pages out after that. `look` at the end is what puts a described room
# under the artwork rather than the tail of the opening text. NOT more blank
# `cr`s to be safe: they reach the parser, and three `[I beg your pardon?]`
# replies is what the first capture of this shot actually put in the frame.
keys = "wait:4000,cr,wait:2500,cr,wait:3000,text:look,cr,wait:4000"
size = "82x44"
backend = "kitty"
v6_render = "extended"
# In RASTER the whole screen is one image, so there are no text cells for a guard
# to search — the same reason `arthur-amiga-proportional` and
# `macintosh-embedded-face` above lean on the pane title plus an art floor.
expect = ["James Clavell's Shogun.adf"]
# THE GUARD IS THE EXTENSION ITSELF, not the artwork — set where a frame that
# declined to grow cannot reach it. Measured: 3280 cells, which is 80x41, the whole
# of the pane's content. A plain `raster` frame at this size letterboxes 640x400 at
# the same 2x into 1280x800 and covers 80x25 = 2000, so anything at or above 2000
# would pass on a frame that never extended at all. 2400 is between the two with
# room on both sides.
expect_art_cells = 2400

# ── lanthorn itself ──────────────────────────────────────────────────────────
#
# The frames above are about games. These are about the program: the browser, the
# inspector, the matrix view, and the two engines whose screens are not the
# Z-machine's. They were the stills in README.md that no shot produced, so they
# were the ones nobody could regenerate without a camera (SQ-1080).
#
# ── AND THE TWO THAT OPEN A DIRECTORY (SQ-1080) ──────────────────────────────
#
# `library = true` says the frame is the PICKER, and `media` then names a
# `[[libraries]]` entry below rather than a file. It changes four things:
#
#   * the library is STAGED — one symlink per member, into a throwaway directory
#     per capture — and lanthorn is launched on that, from its parent, so the
#     directory NAME is what the header shows. (Named absolutely it is sixty
#     characters of system temp path that clip the key hints off the end.)
#   * provenance is the library, not a story. Nothing has been mounted, so there
#     is no release, no serial, no medium and no native screen to read, and
#     `Provenance::Library` says so instead of filling a story's fields with
#     zeroes. The count under the header is the picker's own and is left to the
#     frame to state.
#   * `default_story_dir` is written into the run's config. A directory on the
#     command line otherwise trips the first-use "set this as your default story
#     directory?" question, which reads a LINE from stdin in cooked mode BEFORE
#     the terminal is touched at all — before the colour query, before raw mode.
#     No keypress in a key spec can answer it, because the driver's keys start
#     after the app has settled. Falsified by removing the config write, at which
#     point the capture fails with "NOT KITTY — lanthorn never asked the kitty
#     capability query": the app was still blocked on `read_line`. So the prompt
#     is not answered — it is not asked.
#   * no per-game sidecar is written, because the path is not a game.
#
# `v6_render`, `show_map` and `--pictures` are all REFUSED on a library shot: each
# describes a story that has not been opened, and a field silently ignored is
# worse than one rejected.
#
# WHERE THE COVERS COME FROM, AND WHY THAT DECIDES THE FIXTURE. A cover is
# either the story's own `Fspc` frontispiece, out of its own bytes, or a
# `cover.png` an IFDB fetch wrote into the save directory. The gallery gives
# every shot a FRESH user dir, so the second kind does not exist here and cannot:
# a shot that fetched from IFDB would be a test that reaches the network, and one
# that read this machine's fetch cache would be a frame nobody else can
# regenerate. Every cover below is therefore the story's own.
#
# Which is why a library shot names its MEMBERS rather than pointing at
# `stories/`. Pointing at `stories/` was tried first and is the wrong fixture
# twice over: the frame shows whatever that folder holds on the day — 287 entries
# on this machine, a different set on the next — and the picker sorts by title,
# so the alphabet decides which screenful the shot lands on. Measured: the
# top-of-alphabet screenful is `advent`, `advent`, `advent`, `Adventureland`,
# four empty boxes and no metadata at all, because the frontispieces are spread
# evenly through the alphabet and the Infocom rows have no author until somebody
# fetches one. A named library is a fixture; a directory is a coincidence.
#
# Every member below carries BOTH an `Fspc` frontispiece and an `IFmd` metadata
# chunk, so the covers, the authors and the years in these two frames all come
# out of the stories' own bytes.

[[libraries]]
id = "frontispieces"
from = "stories"
members = [
  "And_Then_You_Come_to_a_House.gblorb.blorb",
  "Brain_Guzzlers_from_Beyond!.gblorb.blorb",
  "Coloratura.gblorb.blorb",
  "CounterfeitMonkey-11.gblorb",
  "cragne.gblorb",
  "Dr Ludwig and the Devil.gblorb",
  "Dual.zblorb.blorb",
  "Eat_Me.gblorb",
  "FooFoo.gblorb.blorb",
  "Game of Worlds Tournament.gblorb",
  "Kerkerkruip.gblorb",
  "LostPig.zblorb.blorb",
  "MidnightSwordfight.gblorb",
  "Never Gives Up Her Dead.gblorb",
  "Sub_Rosa.gblorb.blorb",
  "Superluminal_Vagrant_Twin.gblorb.blorb",
  "TAKE.gblorb",
  "THE BAT.gblorb.blorb",
  "The_Magpie_Takes_the_Train.gblorb.blorb",
  "The_Mary_Jane_of_Tomorrow.gblorb.blorb",
  "The_Song_of_the_Mockingbird.gblorb.blorb",
  "The_Wizard_Sniffer.gblorb.blorb",
  "Violet.zblorb.blorb",
  "Zozzled.gblorb.blorb",
  "the-impossible-bottle.zblorb.blorb",
]

[[shots]]
id = "story-list"
title = "The story picker"
press = "a story library, in list view"
media = "frontispieces"
library = true
caption = """
Point lanthorn at a directory instead of a story and it opens its catalogue: \
every game the folder holds, resolved without running any of them — title, \
author and year out of each story's own metadata, the engine and container as a \
badge, and a save marker where there is one. Any column sorts. The panel beside \
it is the selected story's, cover included."""
# `i` opens the info panel (it starts closed), and the moves after it are what
# put a story with its own frontispiece under the cursor — the panel only asks
# for a cover once it is open and the selection has settled.
keys = "wait:9000,i,wait:2500,down,wait:400,down,wait:400,down,wait:2500"
size = "140x32"
# Four claims, and each one fails differently: the picker opened at all; the
# columns resolved (an empty AUTHOR column is what a catalogue with no metadata
# looks like, and it looks fine); the info panel is open; and the cover in it
# actually decoded, which is the only thing `expect_art_cells` can see.
expect = ["choose a story", "TITLE", "AUTHOR", "Info"]
expect_art_cells = 300

[[shots]]
id = "cover-gallery"
title = "The story picker"
press = "a story library, in cover view"
media = "frontispieces"
library = true
caption = """
The same catalogue as a wall of covers. `g` switches the list for a grid of \
frontispieces — drawn as kitty graphics, at whatever size the tiles come out — \
with the selected story's panel still beside it. The art is each story's own: a \
blorb that carries an `Fspc` frontispiece has its cover in its bytes, and \
nothing here asks the network for anything."""
keys = "wait:9000,g,wait:3000,i,wait:2500,right,wait:600,right,wait:4000"
size = "140x38"
# The whole point of the frame is the artwork, so the art floor is the guard that
# matters: a grid that resolved no cover at all still draws its placeholder boxes
# and its titles, and reads as a perfectly good screenshot of nothing. 2000 is
# chosen to be out of the INFO PANEL's reach — the panel's own cover is at most
# ~40x17 cells, so a floor near it could be met with an empty grid beside a
# populated panel. Measured here: ~3100 cells, twelve tiles plus the panel.
expect = ["choose a story", "g: list"]
