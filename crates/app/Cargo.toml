[[test]]
name = "v6_journey"
path = "tests/v6_journey.rs"
required-features = ["terminal"]

[[test]]
name = "v6_render"
path = "tests/v6_render.rs"
required-features = ["terminal"]

[[test]]
name = "v6_scopa"
path = "tests/v6_scopa.rs"
required-features = ["terminal"]

[[test]]
name = "v6_shogun"
path = "tests/v6_shogun.rs"
