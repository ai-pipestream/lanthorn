# `cargo binstall lanthorn` (SQ-1250) fetches a prebuilt release archive
# instead of compiling. `release.yml` names archives
# "lanthorn-{version}-{name}.{tar.gz|zip}" where {name} is NOT a Rust target
# triple — "linux-x86_64" / "linux-aarch64" / "macos-universal2" /
# "windows-x86_64" — with one macOS archive already universal across both
# Apple triples, so there is no single templated `pkg-url` that covers all
# four; each shipped triple is an explicit override instead, and a triple
# release.yml does not build has no override, so binstall falls back to a
# source build for it rather than guessing a URL. Every archive holds the
# bin at its top level (`dist/<name>/lanthorn`, alongside README.md and
# LICENSE), no nested dir.
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/lanthorn-{ version }-linux-x86_64.tar.gz"
bin-dir = "lanthorn-{ version }-linux-x86_64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/lanthorn-{ version }-linux-aarch64.tar.gz"
bin-dir = "lanthorn-{ version }-linux-aarch64/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/lanthorn-{ version }-macos-universal2.tar.gz"
bin-dir = "lanthorn-{ version }-macos-universal2/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/lanthorn-{ version }-macos-universal2.tar.gz"
bin-dir = "lanthorn-{ version }-macos-universal2/{ bin }{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/lanthorn-{ version }-windows-x86_64.zip"
pkg-fmt = "zip"
bin-dir = "lanthorn-{ version }-windows-x86_64/{ bin }{ binary-ext }"

# SQ-1804: every `t-*` group implies `terminal` — the in-crate tests build
# `Picker`s and drive the protocol caches, and none of them is meaningful
# without it.
# SQ-1242: `app`'s ~3,271 in-crate `#[test]`s (all under `#[cfg(test)] mod tests`
# blocks, one per source file) are gated behind these marker features instead of
# bare `cfg(test)`, so `cargo check -p app --lib --tests` with no features on
# compiles none of them — 33s for `--lib` alone vs 5m19s for `--tests` unguarded
# was the whole reason. Each `t-*` feature names a slice of the module tree; a
# developer can guess the group from the file. Plain markers, no deps. `t-all`
# must list every `t-*` feature — `t_all_lists_every_group` in
# `crates/app/tests/suites/test_feature_gating.rs` fails the build if a group is
# missing from it or if any `#[cfg(test)] mod` in `src/` is left ungated on one
# of these features. Run one group: `cargo nextest run -p app --lib --features
# t-input input`. Run everything (CI does): `--features t-all` or
# `--all-features`.
[features]
# SQ-1541: sound output through a real device (`audio/playback` → rodio → cpal,
# and on Linux ALSA, which needs libasound2-dev to build). On by default, and the
# TUI always has it; a host that delivers sound elsewhere builds with
# `--no-default-features` and installs its own `host::sound::SoundSink` — the
# PCM decoders (`audio::decode_aiff`, `audio::tone`, `audio::render_mod`) need
# no device either way. `mod-music` is ProTracker MOD decoding (pure Rust),
# separate so it can stay on without playback.
default = ["terminal", "playback", "mod-music"]
# SQ-1804: terminal graphics — everything that encodes or uploads the kitty,
# sixel and iTerm2 image protocols or falls back to halfblocks through
# `ratatui-image` (the game/inline/cover/document image caches, the protocol
# probe and `AppState::game_picker`). On by default, and the TUI and every test
# need it. A non-terminal embedding host (a GUI app, including its Android and
# iOS builds) depends on lanthorn with `default-features = false, features =
# ["mod-music"]`: ratatui-image's kitty shared-memory path enables rustix's
# `shm`, which rustix's libc backend cannot provide on Android, so the crate
# does not build there at all. The protocol-free paths a host draws with
# (`compose_v6_frame`, `build_hybrid_frame_with`, the cell path, click maps,
# `cover::cover_bytes`) compile either way; the feature is purely additive.
# CI (`no-terminal` job) checks the lib for the host, Android and iOS targets.
terminal = ["dep:ratatui-image"]
playback = ["audio/playback"]
mod-music = ["audio/mod-music"]
t-input = ["terminal"]    # input.rs, keymap, slash(_dispatch), browser, complete, pixel/pane mouse
t-render = ["terminal"]   # render/*, plus the model layer it draws (graphics, layout, fonts, list_scroll, pager, clipboard, cell_dump)
t-picker = ["terminal"]   # picker*, ifdb*, ifiction, ifid, fetch_worker, cover*, story_info/menu/pick/url, launch_options*, metadata_import
t-session = ["terminal"]  # session/glulx_session/scott_session, engine*, probe*, turn, glk_backend, glulx_debug/roomlock, interpreter, inventory, machine_boot, reload, reset, startup
t-guidance = ["terminal"] # vocab, reveal (word reveal), assist, hints, hint_download
t-persist = ["terminal"]  # archive*, history, storage, config*, styles, aux/vfs/persist stores, garglk_ini, ingame_io, pcset_store
t-theme = ["terminal"]    # theme/*, colors, style, term_colors, period
t-state = ["terminal"]    # state.rs, overlays, debug_panel, mapper glue (map_dump, roomid, export*, tidy, symbols)
t-misc = ["terminal"]     # everything with no closer home: anim, assets, docs_reference, lifecycle, loop_tick, main, native_sound, notify, query_sweep, stderr_redirect, terminal_dump, trace, watch, corpus, lib.rs's own palette-guard self-test
t-all = ["t-input", "t-render", "t-picker", "t-session", "t-guidance", "t-persist", "t-theme", "t-state", "t-misc"]

[dependencies]
buildinfo = { package = "lanthorn-buildinfo", path = "../buildinfo", version = "0.9.8" }
# SQ-0850: the per-game save-directory key and the canonical-title table the
# readable half of it comes from. Shared with `zvm-cli` so the TUI and the CLI
# cannot name one game's save directory two different ways.
cli-host = { package = "lanthorn-cli-host", path = "../cli-host", version = "0.9.8" }
zvm = { package = "lanthorn-zvm", path = "../zvm", version = "0.9.8" }
gvm = { package = "lanthorn-gvm", path = "../gvm", version = "0.9.8" }
scott = { package = "lanthorn-scott", path = "../scott", version = "0.9.8" }
# SQ-1041: the shape of what a story's parser accepts, produced by both grammar
# readers, so the vocabulary offer is one piece of code for every engine.
grammar-model = { package = "lanthorn-grammar-model", path = "../grammar-model", version = "0.9.8" }
# SQ-1119: the one thing a story file cannot answer — that `illuminate` means
# `light`. A shipped table, parsed lazily behind a `OnceLock` on the first
# rejected word, so a session that never has one never reads it.
verb-synonyms = { package = "lanthorn-verb-synonyms", path = "../verb-synonyms", version = "0.9.8" }
mapper = { package = "lanthorn-mapper", path = "../mapper", version = "0.9.8" }
blorb = { package = "lanthorn-blorb", path = "../blorb", version = "0.9.8" }
# Features chosen by this crate's own `playback`/`mod-music` (see [features]).
audio = { package = "lanthorn-audio", path = "../audio", version = "0.9.8", default-features = false }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
# Optional (SQ-1804): the `terminal` feature below owns it.
ratatui-image = { version = "12.0.0-rc.0", default-features = false, optional = true }
# gif: IFDB and the IFComp archive serve some covers as GIF; without the
# decoder those fetches were dropped as "does not decode" (13 of 29 in one
# curated import, two of them IFDB's own).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
zip = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
# SQ-1721/SQ-1722: the platform home directory (Known Folder API on Windows) and
# its app-data folders. MIT OR Apache-2.0. Not used by zvm/gvm/scott.
dirs = "6"
regex = "1"
# `wrap_help` reflows long help to the real terminal width. Without it clap does
# not wrap AT ALL — it joins a doc comment into one paragraph and prints it — so
# every long option ran off the edge and only the ones carrying
# `verbatim_doc_comment` looked right, because those keep the source's own line
# breaks rather than being wrapped.
clap = { version = "4", features = ["derive", "wrap_help"] }
notify = "6"
unicode-width = "0.1"
unicode-segmentation = "1"
signal-hook = "0.3"
jiff = "0.2"
roxmltree = "0.21"
ureq = "3.3"
hyperrat = "0.1.3"
font8x8 = "0.3"
# SQ-0976: zlib for the kitty graphics protocol's `o=z` payload compression.
# Already in the graph three times over (png, ureq, zip), so naming it here
# compiles nothing new.
flate2 = "1"

# SQ-0764: a SECOND opinion on the bytes lanthorn emits. The pty harness
# (SQ-0762) decodes the stream with our own hand-rolled decoder, which is
# exactly as likely to be wrong as the code it is auditing. `qwertty-term-vt` is
# Ghostty's terminal core ported to Rust — a real emulator's resolution of the
# same bytes, so "an image covers these cells" versus "a background colour was
# painted into these cells" has an independent witness. TESTS ONLY: the shipped
# binary must never gain it (`cargo tree -p lanthorn -e normal | grep -c qwertty`
# must print 0).
[dev-dependencies]
# SQ-1394: turns on zvm's `fixtures` feature (gated off by default so its
# `CARGO_MANIFEST_DIR`-baking module never reaches a normal downstream build)
# for this crate's own test builds, which is the only place `session.rs`'s
# tests reach `zvm::fixtures::load`.
zvm = { package = "lanthorn-zvm", path = "../zvm", version = "0.9.8", features = ["fixtures"] }
# SQ-0942: a real typeface for the gallery tool (`--example gallery`), whose
# output is meant to be LOOKED at. It is NOT used by the geometry oracle, which
# keeps its deliberately-synthetic bitmap face — see
# `tests/pty_stream/gallery.rs` for why giving that one a real font would be
# actively harmful. TESTS ONLY, like the line below it.
fontdue = "0.9"
qwertty-term-vt = "0.4.0"

# SQ-0586: fd-level stderr redirect. C libraries (libasound via rodio/cpal) write
# to fd 2 directly, so nothing in Rust can intercept them — only dup2 can.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
