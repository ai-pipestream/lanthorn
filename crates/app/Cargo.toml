[package]
# Package renamed for crates.io (SQ-1250): "app" -> "lanthorn". Every
# `-p app` invocation across CI/docs became `-p lanthorn` (cargo's `-p`
# matches package name, not the `[lib] name` below, which is unchanged so
# every `use app::…` in the integration tests keeps working).
name = "lanthorn"
description = "A terminal interactive-fiction interpreter (Z-machine, Glulx, Scott Adams) with live automapping"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["interactive-fiction", "z-machine", "glulx", "terminal", "tui"]
categories = ["games", "command-line-utilities"]
include = ["src/**", "assets/**", "Cargo.toml"]

[lib]
name = "app"
path = "src/lib.rs"
# No doctests in this crate; skip the rustdoc doctest pass (it costs seconds of
# harness compilation for zero tests). Drop this if real doctests are added.
doctest = false

[[bin]]
name = "lanthorn"
path = "src/main.rs"
required-features = ["terminal"]

# SQ-1306: the static map generator — draws a story's whole map from the story
# file with nothing played. Named explicitly rather than left to `src/bin/`
# auto-discovery so `include` above (which lists `src/**`) and the release
# workflow's per-binary copy loop both have something to point at. Ships with
# the release archives and with `cargo install lanthorn`, which installs every
# `[[bin]]` in the package.
[[bin]]
name = "lanthorn-mapgen"
path = "src/bin/lanthorn_mapgen.rs"

# SQ-1804: the integration suites and examples drive the terminal-graphics
# renderer (`Picker`, the protocol caches), so they build only with the
# `terminal` feature. Declared explicitly because cargo's auto-discovered
# targets cannot carry `required-features`; a new top-level `tests/*.rs` or
# example needs its own entry here.
[[test]]
name = "dumps"
path = "tests/dumps.rs"
required-features = ["terminal"]

[[test]]
name = "engines"
path = "tests/engines.rs"
required-features = ["terminal"]

[[test]]
