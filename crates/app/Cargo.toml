[package]
name = "app"
version = "0.1.0"
edition = "2021"

[lib]
name = "app"
path = "src/lib.rs"
# No doctests in this crate; skip the rustdoc doctest pass (it costs seconds of
# harness compilation for zero tests). Drop this if real doctests are added.
doctest = false

[[bin]]
name = "babelmap"
path = "src/main.rs"

[dependencies]
zvm = { path = "../zvm" }
gvm = { path = "../gvm" }
scott = { path = "../scott" }
mapper = { path = "../mapper" }
blorb = { path = "../blorb" }
audio = { path = "../audio" }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
crossterm = "0.29"
ratatui-image = { version = "11.0.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
zip = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
regex = "1"
clap = { version = "4", features = ["derive"] }
notify = "6"
unicode-width = "0.1"
signal-hook = "0.3"
jiff = "0.2"
roxmltree = "0.21"
ureq = "3.3"
hyperrat = "0.1.3"
