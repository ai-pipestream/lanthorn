[workspace]
members = ["crates/zvm", "crates/zvm-cli", "crates/mapper", "crates/app", "crates/blorb", "crates/gvm", "crates/gvm-cli", "crates/audio", "crates/scott", "crates/scott-cli", "crates/buildinfo", "crates/cli-host"]
# Standalone UCD table generator — run by hand only when the pinned Unicode
# version bumps; its output is committed so gvm stays zero-dep.
exclude = ["crates/gvm/tables-gen"]
resolver = "2"

# Shared package metadata inherited by each crate via `<field>.workspace = true`.
# Bump `version` here to version every crate (and the binaries' --version) at once.
[workspace.package]
version = "0.1.0-beta.5"
license = "BSD-3-Clause"

# SQ-0764: the emitted-stream oracle's dependency, with its own debug assertions
# off. `qwertty-term-vt` 0.4.0's kitty transmit path trips
# `debug_assert!(!load.more)` (src/kitty/exec.rs:208) on a chunked
# transmit-and-display: it hands back the deferred display on EVERY intermediate
# `m=1` chunk instead of only the last. lanthorn chunks every upload at 3072
# bytes, so replaying any real capture hits it on the second chunk. With the
# assertion compiled out the port behaves as it does in release — the premature
# display finds no stored image and is refused, and the final chunk places the
# image correctly — which is the behaviour the oracle needs. Test-profile only;
# the crate is a dev-dependency and never reaches the shipped binary.
[profile.dev.package.qwertty-term-vt]
debug-assertions = false

# Line-tables-only debug info: keeps panic backtraces with file/line, but drops
# the variable-inspection DWARF that bloats debug/test binaries to ~45 MB each
# and makes every relink slow. Test builds inherit this from [profile.dev].
# Remove (or raise to `debug = true`) if you need full lldb variable inspection.
[profile.dev]
debug = "line-tables-only"
