# babelmap style.toml — auto-seeded, every line commented out.
# This file is a no-op until you uncomment lines: every commented value here
# is already the built-in default, reconstructed straight from the style
# registry. Edit, uncomment, save, then run /reload in-app to apply changes
# live (or turn on config.toml's watch_style to auto-reload on save).
#
# Color values accept: a named color (cyan, dark-gray, light-blue, …),
# palette:N (0-15 from the active scheme), #rrggbb hex, a 256-index ("17"),
# or background / foreground (the scheme's bg/fg).

# scheme = "tomorrow-night"   # optional base: built-in name or a Ghostty theme path; omit for terminal colours

# ── Roles: the 7 roots everything else derives from.
# [roles]
# text = {}
# chrome = {}
# border = {}
# accent = {}
# muted = {}
# alert = {}
# heading = {}

# ── Elements: app chrome/text. Every line already equals its default.
# [elements]
# transcript = { parent = "text" }
# status_bar = { parent = "chrome", reversed = true }
# help_bar = { parent = "chrome", reversed = true }
# upper_window = { parent = "chrome" }
# story_info = { parent = "chrome" }
# status_header = { parent = "heading", bg = "black" }
# story_title = { parent = "heading" }
# input_line = { parent = "border" }
# suggestion_line = { parent = "border" }
# scrollbar = { parent = "border" }
# transcript_location = { parent = "accent" }
# story_badge = { parent = "accent", reversed = true }
# hyperlink = { parent = "accent", underline = true }
# story_info_label = { parent = "muted" }
# suggestion = { parent = "muted" }
# transcript_meta = { parent = "muted", glyph = "▏" }
# transcript_warning = { parent = "alert", glyph = "!" }
# transcript_crash = { parent = "alert", bold = true }
# more_prompt = { parent = "chrome", reversed = true }
# tidy_progress = { parent = "accent" }
# meta_marker = { parent = "muted" }
# inventory_dock = { parent = "accent" }
# story_info_title = { parent = "heading" }
# story_info_value = { parent = "text" }
# story_info_blurb = { parent = "muted", italic = true }
# story_info_link = { parent = "accent", underline = true }
# story_info_cover = { parent = "chrome" }
# graphics = { parent = "chrome" }
# inline_image = { parent = "chrome" }
# story_header = { parent = "muted" }
# story_header_active = { parent = "accent", bold = true }
# story_author = { parent = "text" }
# story_year = { parent = "text" }
# story_no_metadata = { parent = "muted" }
# story_tile = { parent = "text" }
# story_tile_selected = { parent = "accent", bold = true, reversed = true }
# notification = { parent = "accent", reversed = true }
# dialog = { parent = "chrome" }
# dialog_title = { parent = "accent" }
# dialog_button = { parent = "chrome", reversed = true }
# dialog_button_active = { parent = "accent", reversed = true }
# dialog_shadow = { parent = "muted", bg = "dark-gray" }
# hotkey_key = { parent = "accent" }
# sound_beep_high = { fg = "#ffb428" }
# sound_beep_low = { fg = "#3c8cdc" }
# transcript_input = { parent = "accent" }
# transcript_system = { parent = "muted" }
# warning_marker = { parent = "alert" }
# input_text = { parent = "text" }
# input_prompt = { parent = "text" }
# upper_window_border = { parent = "border" }
# room_panel = { parent = "accent", reversed = true }

# ── Panel: shared chrome for every panel (border/title/tabs). Story/Glk
# windows use [glk.*] instead, not this section.
# [panel]
# background = { parent = "chrome" }
# border = { parent = "border", style = "single" }
# "border:active" = { parent = "border", bold = true, style = "single" }
# title = { parent = "heading" }
# tab = { parent = "muted" }
# "tab:active" = { parent = "accent", bold = true }
# tab_divider = { parent = "border", glyph = "│" }
# terminator_left = { parent = "border", glyph = "┤" }
# terminator_right = { parent = "border", glyph = "├" }

# ── The 11 Glk styles for text-buffer windows (base: text).
# [glk.buffer]
# normal = { parent = "text" }
# emphasized = { parent = "text", italic = true }
# preformatted = { parent = "text" }
# header = { parent = "heading", bold = true }
# subheader = { parent = "heading", bold = true }
# alert = { parent = "alert", bold = true }
# note = { parent = "muted", italic = true }
# blockquote = { parent = "muted" }
# input = { parent = "accent" }
# user1 = { parent = "text" }
# user2 = { parent = "text" }

# ── The 11 Glk styles for text-grid windows (base: chrome).
# [glk.grid]
# normal = { parent = "chrome" }
# emphasized = { parent = "chrome", italic = true }
# preformatted = { parent = "chrome" }
# header = { parent = "heading", bold = true }
# subheader = { parent = "heading", bold = true }
# alert = { parent = "alert", bold = true }
# note = { parent = "muted", italic = true }
# blockquote = { parent = "muted" }
# input = { parent = "accent" }
# user1 = { parent = "chrome" }
# user2 = { parent = "chrome" }

# ── Map colours + glyph-set presets.
# [map]
# background = {}
# room = { parent = "text" }
# room_current = { parent = "accent" }
# room_selected = { parent = "accent", reversed = true }
# connector = { parent = "accent" }
# connector_distorted = { fg = "magenta" }
# connector_portal = { parent = "accent" }
# shared_path = { fg = "light-cyan" }
# loc_indicator = { parent = "muted" }
# layer_cycle = ["cyan", "green", "magenta", "yellow", "blue"]
# box_style = "rounded"
# arrow_set = "filled"
# portal_icons = "ascii"
# path_style = "light"
# portal_path_style = "dotted"

# ── Debug inspector disassembly selectors.
# [debug]
# pc = { parent = "accent", reversed = true }
# tooltip = { parent = "chrome" }
# disasm_executed = { parent = "accent", glyph = "|" }
# disasm_rd = { parent = "text", glyph = " " }
# disasm_soft = { parent = "muted", glyph = " " }
# disasm_data = { parent = "muted", italic = true, glyph = " " }

# ── Story-line styling rules: recolour whole transcript lines matching a ────
# ── regex. Rules are tried in order; the first match wins. ──────────────────
# [[transcript.rule]]
# match = "^>.*"                 # your echoed command lines → magenta bold
# fg = "magenta"
# bold = true

# [[transcript.rule]]
# match = "(?i)\\bgrue\\b"       # any line mentioning a "grue" → red (flavour example)
# fg = "red"

# ── Status bar. Omit [statusbar] for the built-in default. ───────────────────
# Placeholders: {location} {score} {moves} {time} {turns} {title} {filter}
# [statusbar]
# border = "none"

# [[statusbar.segment]]
# text  = "{location}"
# align = "left"
# parent = "accent"              # segments may reference a role or set fg/bg directly
# bold  = true

# [[statusbar.segment]]
# text  = "Score: {score}  Moves: {moves}"
# align = "right"

# [[statusbar.segment]]
# text  = "{time}"
# align = "right"
