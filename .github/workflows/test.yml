name: Test

# The push/PR gate this repo was missing — release.yml only builds on `v*`
# tags. This runs the workspace test suite (+ clippy, one platform) on every
# push to main and every pull request.

# Prose is not code: a push that touches only the README, the changelog or the
# docs tree (its PNGs included) builds nothing and gets no run. The one thing
# this forgoes is the link check in `docs_reference`, which is cheap to run
# locally (`cargo nextest run -p lanthorn docs_reference`) when a doc change adds a
# link. A push that mixes prose with Rust still runs in full.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'machine-screenshots/**'
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'machine-screenshots/**'

# A new run cancels an in-progress one for the same ref — e.g. re-pushing to a
# PR branch. Distinct refs (different PRs, or PR vs. main) get their own
# group, so they never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `.cargo/config.toml` builds into `target.noindex` (a Spotlight exclusion that
# only matters on a developer's Mac); the environment variable wins over it, so
# every `target/...` path below keeps working.
env:
  CARGO_TARGET_DIR: target

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # Linux audio (ALSA) is a build-time dependency of the default feature
      # set (audio's default features pull in rodio) — same requirement as
      # release.yml's Linux leg.
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      # `.cargo/config.toml` caps build parallelism at 8 so a rebuild leaves the
      # DEVELOPER's 12-core machine usable while it runs. A runner has 3-4 cores,
      # where eight concurrent rustc processes are slower AND put a crate the size
      # of `app` near the memory ceiling — so give the runner its own core count
      # back. The environment variable wins over the config file, and `getconf`
      # answers on all three of Linux, macOS and Git-bash.
      - name: Un-cap build jobs for the runner
        shell: bash
        run: |
          # `nproc` on Linux, `getconf` on macOS, either on Git-bash. If neither
          # answers, say nothing: cargo then falls back to the config file's 8,
          # which is merely suboptimal — this step must not be able to fail CI.
          n=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) echo "core count unavailable; leaving jobs capped" ;;
                       *) echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV" ;; esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Story fixtures (SQ-1015). `stories/` is gitignored commercial media and
      # is never here, so ~150 suites used to skip vacuously on the run that
      # guards a merge. `scripts/fixtures.manifest` names the subset the IF
      # Archive distributes freely; the script fetches it and verifies every
      # SHA-256, failing rather than proceeding on a mismatch — a fixture that
      # changed under us is a worse outcome than one that is absent.
      #
      # Fetched, never committed: the Archive's Terms of Use presume material
      # with no attached licence is licensed for personal use only, which covers
      # downloading it and not republishing it in a repository of ours.
      #
      # The cache key is the manifest's own hash, so editing the manifest is what
      # invalidates it and nothing else can. A hit makes the step a digest check
      # over ~50 MB; a miss re-downloads from ifarchive.org.
      - name: Cache fetched story fixtures
        uses: actions/cache@v4
        with:
          path: crates/app/tests/fixtures/stories
          key: fixtures-${{ matrix.os }}-${{ hashFiles('scripts/fixtures.manifest') }}

      - name: Fetch story fixtures
        shell: bash
        run: scripts/fetch-fixtures.sh

      # `--locked` requires Cargo.lock to be committed and in sync with
      # Cargo.toml (it is) — this also guards against drift on Windows, where
      # a regenerated lockfile can differ in ways CI shouldn't silently accept.
      #
      # Story-fixture-gated tests skip themselves cleanly when their file is
      # absent. That is still true of the COMMERCIAL media under the gitignored
      # `stories/` dir, which is never here and never will be. It is no longer
      # true of the free subset the step above fetched: `LANTHORN_FIXTURES_REQUIRED`
      # makes `fixture_paths::fixture_path` panic instead of answering with a
      # path that is not there, for the names `scripts/fixtures.manifest`
      # promises and those only. Without it a half-failed fetch would read as a
      # green run full of quiet skips, which is precisely the blind spot the
      # fetch exists to close. Nothing outside CI sets it, so a developer's run
      # keeps skipping exactly as before.
      #
      # Small fixtures actually needed by the suite (czech.z5, minizork.z3,
      # tiny_cave.dat, glulxercise.ulx, etc.) are committed under each crate's
      # `tests/fixtures/` and are present.
      # SQ-1242: `app`'s in-crate unit tests sit behind `t-*` Cargo features
      # (crates/app/Cargo.toml) so a plain `cargo test` no longer compiles or
      # runs them — `--all-features` is what turns every `t-*` group (via
      # `t-all`) back on, for `app` and harmlessly for every other crate.
      - name: cargo test
        env:
          LANTHORN_FIXTURES_REQUIRED: '1'
        run: cargo test --workspace --locked --all-features

      # One job, Linux only — clippy's result doesn't vary meaningfully by OS
      # for this codebase, so running it 3x would just burn minutes.
      # `--all-features` for the same SQ-1242 reason as the test step above.
      - name: cargo clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # NOTE: no `cargo fmt --check` step. The existing codebase isn't
      # rustfmt-clean (verified locally: `cargo fmt --check` reports diffs
      # across many pre-existing files), so adding the check now would fail
      # on unrelated code rather than catch new drift. Revisit once the tree
      # is formatted.

  # SQ-1541: `app` without sound output — what a host that delivers sound
  # somewhere else (a browser, a phone) builds. `--no-default-features` drops
  # `playback`, and with it rodio → cpal → alsa-sys, so this job deliberately
  # does NOT install libasound2-dev: if ALSA creeps back into this build, the
  # tree check below names the path and the build fails on the missing
  # headers. Linux only, because ALSA is Linux-only.
  no-playback:
    name: build without sound output (ubuntu-latest, no ALSA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: no-playback

      # Written to a file first so a failing `cargo tree` fails this step rather
      # than reading as "no match".
      - name: No audio device library in the dependency tree
        run: |
          cargo tree -p lanthorn --locked --no-default-features --features terminal -e normal --target all --prefix none > tree.txt
          if grep -E '^(alsa-sys|alsa|cpal|rodio) ' tree.txt; then
            echo "::error::lanthorn without --features playback still depends on an audio device library"
            exit 1
          fi

      # SQ-1804: `--no-default-features` also drops `terminal` now, and the
      # binary requires it — so this keeps building the TUI (terminal graphics
      # on, sound output off) as it always did.
      - name: cargo build --no-default-features --features terminal
        run: cargo build -p lanthorn --locked --no-default-features --features terminal

  # SQ-1804: `app` without terminal graphics — what a non-terminal embedding host
  # (a GUI app, including its Android and iOS builds) depends on:
  # `default-features = false, features = ["mod-music"]`. ratatui-image is behind
  # the `terminal` feature because its kitty shared-memory path enables rustix's
  # `shm`, which rustix's libc backend cannot provide on Android; this job is what
  # keeps that true. The Android and iOS legs only `cargo check` the library: they
  # prove it COMPILES for the target, which is the thing that regressed.
  no-terminal:
    name: library without terminal graphics (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux host
            os: ubuntu-latest
            target: ''
          - name: android aarch64
            os: ubuntu-latest
            target: aarch64-linux-android
          - name: ios aarch64
            os: macos-latest
            target: aarch64-apple-ios
    steps:
      - uses: actions/checkout@v4

      # Same reason as the `test` job's step: a runner has 3-4 cores and the
      # config file's cap is for a developer's 12-core machine.
      - name: Un-cap build jobs for the runner
        shell: bash
        run: |
          n=$(nproc 2>/dev/null || getconf _NPROCESSORS_ONLN 2>/dev/null || true)
          case "$n" in ''|*[!0-9]*) echo "core count unavailable; leaving jobs capped" ;;
                       *) echo "CARGO_BUILD_JOBS=$n" >> "$GITHUB_ENV" ;; esac

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add the target
        if: matrix.target != ''
        run: rustup target add ${{ matrix.target }}

      # `ring` (rustls, via ureq) and `zstd-sys` (zip) compile C in their build
      # scripts, so the Android leg needs the NDK's clang as the C compiler. The
      # ubuntu runners ship an NDK and export its root as ANDROID_NDK_LATEST_HOME;
      # the per-API clang wrappers live in
      # toolchains/llvm/prebuilt/linux-x86_64/bin/ as
      # `aarch64-linux-android<API>-clang`. API 24 is Android 7.0.
      - name: Point the C toolchain at the Android NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ls "$bin/aarch64-linux-android24-clang"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: no-terminal-${{ matrix.name }}

      # Written to a file first so a failing `cargo tree` fails this step rather
      # than reading as "no match". `--target all` so a platform-specific edge
      # cannot hide. No ALSA headers are installed on this runner either, so the
      # audio-device libraries cannot creep back in unnoticed.
      - name: No terminal graphics or audio device library in the dependency tree
        if: matrix.target == ''
        run: |
          cargo tree -p lanthorn --locked --no-default-features --features mod-music -e normal --target all --prefix none > tree.txt
          if grep -E '^(ratatui-image|alsa-sys|alsa|cpal|rodio|oboe) ' tree.txt; then
            echo "::error::lanthorn --no-default-features --features mod-music still depends on terminal graphics or an audio device library"
            exit 1
          fi

      - name: cargo check the library
        shell: bash
        run: |
          target=""
          if [ -n "${{ matrix.target }}" ]; then target="--target ${{ matrix.target }}"; fi
          cargo check -p lanthorn --locked --lib --no-default-features --features mod-music $target
