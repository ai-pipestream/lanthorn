name: Release

# Cut a release by pushing a version tag:   git tag v0.2.0 && git push origin v0.2.0
# A `-rc.N` suffix (e.g. v0.2.0-rc.1) marks the release as a pre-release.
# The GitHub Release is created as a DRAFT — review the attached binaries, then
# hit Publish. Run the workflow manually (Actions -> Release -> Run workflow) for
# a dry run: it builds every platform and uploads the archives as run artifacts
# WITHOUT creating a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# A new run cancels an in-progress one for the same ref — e.g. repeated dry-runs
# on main, or re-pushing a tag. Distinct tags get their own group, so two real
# releases never cancel each other. (Drop the `-${{ github.ref }}` to make it a
# single global lane where any new run cancels any in-progress run.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-22.04                 # older glibc for broader compatibility
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - name: macos-universal2
            os: macos-latest                 # arm64 runner; also cross-builds x86_64
            target: universal-apple-darwin
            archive: tar.gz
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      # Linux audio (ALSA) is a build- and run-time dependency of the default
      # feature set. Release binaries link libasound and require libasound2 at
      # runtime (documented in the release notes).
      - name: Install ALSA dev headers (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build binaries
        shell: bash
        env:
          # The four shipped binaries: the mapping TUI + the three no-map CLIs.
          BINS: "-p app -p zvm-cli -p gvm-cli -p scott-cli"
        run: |
          set -euo pipefail
          if [ "${{ matrix.name }}" = "macos-universal2" ]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
            cargo build --release --locked $BINS --target aarch64-apple-darwin
            cargo build --release --locked $BINS --target x86_64-apple-darwin
            mkdir -p target/universal/release
            for bin in babelmap zvm-cli gvm-cli scott-cli; do
              lipo -create -output "target/universal/release/$bin" \
                "target/aarch64-apple-darwin/release/$bin" \
                "target/x86_64-apple-darwin/release/$bin"
              # Ad-hoc re-sign: lipo can invalidate the per-slice signatures, and
              # Apple Silicon refuses to run a binary without a valid one. Not a
              # Developer-ID signature (still un-notarized), just enough to launch.
              codesign --force --sign - "target/universal/release/$bin"
            done
            lipo -info target/universal/release/babelmap
            codesign --verify --verbose target/universal/release/babelmap
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --locked $BINS --target ${{ matrix.target }}
          fi

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"          # v0.2.0 -> 0.2.0
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          NAME="babelmap-${VERSION}-${{ matrix.name }}"
          mkdir -p "dist/${NAME}"

          case "${{ matrix.name }}" in
            windows-x86_64)   RELDIR="target/${{ matrix.target }}/release"; EXT=".exe" ;;
            macos-universal2) RELDIR="target/universal/release";            EXT="" ;;
            *)                RELDIR="target/${{ matrix.target }}/release"; EXT="" ;;
          esac

          for bin in babelmap zvm-cli gvm-cli scott-cli; do
            cp "${RELDIR}/${bin}${EXT}" "dist/${NAME}/"
          done
          cp README.md LICENSE "dist/${NAME}/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "${NAME}.zip" "${NAME}" >/dev/null
            ARCHIVE="${NAME}.zip"
          else
            tar czf "${NAME}.tar.gz" "${NAME}"
            ARCHIVE="${NAME}.tar.gz"
          fi
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE}" > "${ARCHIVE}.sha256"
          else
            shasum -a 256 "${ARCHIVE}" > "${ARCHIVE}.sha256"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          name: babelmap ${{ github.ref_name }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## babelmap ${{ github.ref_name }}

            Download the archive for your platform, extract it, and run `babelmap`
            (or one of the no-map CLI players `zvm-cli` / `gvm-cli` / `scott-cli`).

            > ⚠️ **Alpha** — the `config.toml` / `style.toml` schemas and on-disk
            > save data may change between versions.

            ### Platform notes
            - **Linux** (`x86_64`, glibc, built on Ubuntu 22.04) requires
              **`libasound2`** at runtime for audio —
              `sudo apt-get install libasound2` (Debian/Ubuntu) or your distro's
              equivalent.
            - **macOS** is a universal binary (Apple Silicon + Intel), ad-hoc
              signed but **not notarized** with an Apple Developer ID. If you
              download it with a **browser**, Gatekeeper quarantines it — clear
              the flag with `xattr -dr com.apple.quarantine <extracted-folder>`
              (or approve it once in System Settings → Privacy & Security).
              Downloading and extracting from the **Terminal** avoids quarantine
              entirely: `curl -L <url> -o babelmap.tar.gz && tar xzf babelmap.tar.gz`.
            - **Windows** is `x86_64`. It is unsigned, so SmartScreen may warn on
              first launch (More info → Run anyway).

            Verify a download against its `.sha256` sidecar.
