name: Bug in The Golden Lanthorn (the desktop app)
description: Something in The Golden Lanthorn isn't behaving - a display glitch, a game that misbehaves, a crash.
labels: [golden-lanthorn]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us. A few details up front make a problem much easier to chase down.
        The Golden Lanthorn shares Lanthorn's game engines and mapper, so game and map problems are fixed in this repository.
        Questions and "how do I..." belong in [Discussions](https://github.com/sharkusk/lanthorn/discussions).
  - type: textarea
    id: summary
    attributes:
      label: Summary from Report a problem
      description: |
        Use **Report a problem** in The Golden Lanthorn and paste its summary here, ideally with the game showing the problem open.
        It also saves a full report file - drag that file into the attachments box below.
        Please don't attach commercial game files - the file name and release in the report are enough.
      render: text
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, or the turn it happened on.
    validations:
      required: false
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots and files
      description: |
        Drag and drop the full report file and any screenshots straight into this box.
    validations:
      required: false
